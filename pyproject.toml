[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-llm-bot"
version = "0.1.0"
description = "Minimal Telegram bot with sender profiles and an LLM backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.5,<3",
    "Telethon==1.45.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
telegram-llm-bot = "telegram_llm_bot.__main__:run"
telegram-user-listener = "telegram_llm_bot.user_account.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_llm_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
